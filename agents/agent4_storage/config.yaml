# Agent 4: Data Storage And Management Agent Configuration

playbook:
  name: "agent4_storage"
  version: "1.0.0"
  description: "Data storage and management agent"

  dependencies: []

  ports:
    - 8004

  volumes:
    - "./agents/agent4_storage/data:/app/data"
    - "./agents/agent4_storage/logs:/app/logs"
    - "./shared:/app/shared"

  gpu_required: true
  gpu_count: 1

  resources:
    memory: "8g"
    cpus: 4.0

  environment:
    LOG_LEVEL: "INFO"
    ENVIRONMENT: "production"
    AGENT_NAME: "agent4_storage"

  health_check:
    endpoint: "/health"
    interval: 30
    timeout: 10
    retries: 3
