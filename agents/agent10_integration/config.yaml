# Agent 10: External Systems Integration Agent Configuration

playbook:
  name: "agent10_integration"
  version: "1.0.0"
  description: "External systems integration agent"

  dependencies: []

  ports:
    - 8010

  volumes:
    - "./agents/agent10_integration/data:/app/data"
    - "./agents/agent10_integration/logs:/app/logs"
    - "./shared:/app/shared"

  gpu_required: true
  gpu_count: 1

  resources:
    memory: "8g"
    cpus: 4.0

  environment:
    LOG_LEVEL: "INFO"
    ENVIRONMENT: "production"
    AGENT_NAME: "agent10_integration"

  health_check:
    endpoint: "/health"
    interval: 30
    timeout: 10
    retries: 3
