# Ansible Inventory for Agent 5 Inference Engine

[ollama_servers]
# Add your Ollama server hosts here
# Example:
# ollama1 ansible_host=192.168.1.10 ansible_user=ubuntu

[webui_servers]
# Add your WebUI server hosts here
# Example:
# webui1 ansible_host=192.168.1.11 ansible_user=ubuntu

[nim_servers]
# Add your NIM server hosts here
# Requires NVIDIA GPU with sufficient VRAM
# Example:
# nim1 ansible_host=192.168.1.12 ansible_user=ubuntu

[inference_engine:children]
ollama_servers
webui_servers
nim_servers

[inference_engine:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
