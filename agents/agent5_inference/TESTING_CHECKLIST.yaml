# =============================================================================
# INTEGRATION POINTS
# =============================================================================

integration_points:

  imports_from:
    agent3:
      - type: "Model Checkpoints"
        path: "/path/to/agent3/output/"
        format: "LoRA adapter files"
        trigger: "Manual via import script"

      - type: "Training Metadata"
        path: "/path/to/agent3/training_config.yaml"
        format: "YAML configuration"
        optional: true

  exports_to:
    all_agents:
      - type: "Inference Endpoints"
        ollama_url: "http://localhost:11434"
        webui_url: "http://localhost:8080"
        api_url: "http://localhost:8888"

      - type: "Model Registry"
        endpoint: "GET /api/models"
        format: "JSON"

      - type: "Comparison Results"
        endpoint: "POST /api/compare"
        format: "JSON with metrics"

  used_by:
    agent2_dashboard:
      - "Display available models"
      - "Show inference metrics"
      - "Model comparison visualizations"

    agent7_testing:
      - "Model integration tests"
      - "Performance benchmarks"
      - "Quality validations"

# =============================================================================
# ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:
  core_functionality:
    - criterion: "All services start successfully"
      validation: "docker-compose up completes without errors"

    - criterion: "Inference works on at least one model"
      validation: "Can generate text from llama3.1:8b"

    - criterion: "Model comparison API functional"
      validation: "Can compare 2+ models successfully"

    - criterion: "Benchmark suite produces results"
      validation: "Benchmark completes with statistics"

    - criterion: "Model import from Agent 3 works"
      validation: "Can import and use fine-tuned model"

  performance:
    - criterion: "Inference latency acceptable"
      validation: "P95 latency < 1000ms for 100 tokens"

    - criterion: "Throughput sufficient"
      validation: ">50 tokens/sec on llama3.1:8b"

    - criterion: "Concurrent requests supported"
      validation: "Handles 5 concurrent users"

  integration:
    - criterion: "Agent 3 integration complete"
      validation: "Import script works with LoRA checkpoints"

    - criterion: "APIs accessible to other agents"
      validation: "Endpoints return valid responses"

    - criterion: "Shared components integrated"
      validation: "Uses shared health checks and utilities"

  documentation:
    - criterion: "Usage documented"
      validation: "README contains examples"

    - criterion: "API documented"
      validation: "OpenAPI spec available at /docs"

    - criterion: "Integration guide present"
      validation: "Agent 3 workflow documented"

