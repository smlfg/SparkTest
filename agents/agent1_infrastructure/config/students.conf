# Student User Configuration
# Configuration file for create_student_users.sh

# List of student usernames to create
STUDENTS=(
    "student01"
    "student02"
    "student03"
    "student04"
    "student05"
    "student06"
    "student07"
    "student08"
    "student09"
    "student10"
)

# Workspace base directory
WORKSPACE_BASE="/workspace"

# Quota settings (soft and hard limits)
# Formats: K, M, G, T (e.g., 50G = 50 gigabytes)
QUOTA_SOFT="50G"
QUOTA_HARD="55G"

# Default groups for students (comma-separated)
# Common groups: docker, sudo, users
DEFAULT_GROUPS="docker,users"

# Default shell
DEFAULT_SHELL="/bin/bash"

# SSH key type (rsa, ed25519, ecdsa)
SSH_KEY_TYPE="ed25519"

# Generate SSH keys for users
CREATE_SSH_KEYS="true"

# Additional configuration
# Uncomment and modify as needed

# Force password change on first login
# FORCE_PASSWORD_CHANGE="true"

# Enable user home directory encryption
# ENCRYPT_HOME="false"

# Set default umask
# UMASK="0077"

# Resource limits
# MAX_PROCESSES="1024"
# MAX_FILES="4096"

# GPU allocation (if applicable)
# Comma-separated list of GPU IDs per user
# GPU_ALLOCATION_student01="0"
# GPU_ALLOCATION_student02="1"
# GPU_ALLOCATION_student03="0,1"
