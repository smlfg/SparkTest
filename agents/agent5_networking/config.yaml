# Agent 5: Network Configuration And Routing Agent Configuration

playbook:
  name: "agent5_networking"
  version: "1.0.0"
  description: "Network configuration and routing agent"

  dependencies: []

  ports:
    - 8005

  volumes:
    - "./agents/agent5_networking/data:/app/data"
    - "./agents/agent5_networking/logs:/app/logs"
    - "./shared:/app/shared"

  gpu_required: true
  gpu_count: 1

  resources:
    memory: "8g"
    cpus: 4.0

  environment:
    LOG_LEVEL: "INFO"
    ENVIRONMENT: "production"
    AGENT_NAME: "agent5_networking"

  health_check:
    endpoint: "/health"
    interval: 30
    timeout: 10
    retries: 3
