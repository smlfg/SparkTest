# Agent 9: Workflow Orchestration Agent Configuration

playbook:
  name: "agent9_orchestration"
  version: "1.0.0"
  description: "Workflow orchestration agent"

  dependencies: []

  ports:
    - 8009

  volumes:
    - "./agents/agent9_orchestration/data:/app/data"
    - "./agents/agent9_orchestration/logs:/app/logs"
    - "./shared:/app/shared"

  gpu_required: true
  gpu_count: 1

  resources:
    memory: "8g"
    cpus: 4.0

  environment:
    LOG_LEVEL: "INFO"
    ENVIRONMENT: "production"
    AGENT_NAME: "agent9_orchestration"

  health_check:
    endpoint: "/health"
    interval: 30
    timeout: 10
    retries: 3
