---
- name: Deploy Ollama with GPU Acceleration
  hosts: ollama_servers
  become: true
  vars:
    ollama_version: "latest"
    ollama_port: 11434
    ollama_data_dir: "/var/lib/ollama"
    ollama_models_dir: "{{ ollama_data_dir }}/models"
    nvidia_container_toolkit_version: "latest"
    default_models:
      - "llama3.1:70b"
      - "mistral:7b"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install required packages
      apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - software-properties-common
          - nvidia-driver-535
          - nvidia-utils-535
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: ansible_os_family == "Debian"

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add NVIDIA Container Toolkit repository
      shell: |
        distribution=$(. /etc/os-release;echo $ID$VERSION_ID)
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
        curl -s -L https://nvidia.github.io/libnvidia-container/$distribution/libnvidia-container.list | \
          sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
          tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Update apt cache after adding NVIDIA repo
      apt:
        update_cache: yes

    - name: Install NVIDIA Container Toolkit
      apt:
        name: nvidia-container-toolkit
        state: present

    - name: Configure Docker to use NVIDIA runtime
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "runtimes": {
              "nvidia": {
                "path": "nvidia-container-runtime",
                "runtimeArgs": []
              }
            },
            "default-runtime": "nvidia"
          }
        mode: '0644'
      notify: Restart Docker

    - name: Create Ollama data directory
      file:
        path: "{{ ollama_data_dir }}"
        state: directory
        mode: '0755'

    - name: Create Ollama models directory
      file:
        path: "{{ ollama_models_dir }}"
        state: directory
        mode: '0755'

    - name: Pull Ollama Docker image
      docker_image:
        name: "ollama/ollama:{{ ollama_version }}"
        source: pull
        state: present

    - name: Deploy Ollama container
      docker_container:
        name: ollama
        image: "ollama/ollama:{{ ollama_version }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ ollama_port }}:11434"
        volumes:
          - "{{ ollama_data_dir }}:/root/.ollama"
        runtime: nvidia
        env:
          NVIDIA_VISIBLE_DEVICES: "all"
          NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
        device_requests:
          - driver: nvidia
            count: -1
            capabilities:
              - - gpu

    - name: Wait for Ollama to be ready
      uri:
        url: "http://localhost:{{ ollama_port }}/api/tags"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 2

    - name: Pull default models
      command: "docker exec ollama ollama pull {{ item }}"
      loop: "{{ default_models }}"
      register: pull_result
      changed_when: "'pulling' in pull_result.stdout"
      failed_when: pull_result.rc != 0

    - name: Create systemd service for Ollama
      copy:
        dest: /etc/systemd/system/ollama-container.service
        content: |
          [Unit]
          Description=Ollama Container
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/docker start ollama
          ExecStop=/usr/bin/docker stop ollama
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: Reload systemd

    - name: Enable Ollama systemd service
      systemd:
        name: ollama-container
        enabled: yes
        daemon_reload: yes

    - name: Display Ollama status
      debug:
        msg: "Ollama is running on http://{{ ansible_default_ipv4.address }}:{{ ollama_port }}"

  handlers:
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted

    - name: Reload systemd
      systemd:
        daemon_reload: yes
