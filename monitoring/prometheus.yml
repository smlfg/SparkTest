# Prometheus Configuration for Agent 9

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dgx-spark'
    agent: 'agent9'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ComfyUI
  - job_name: 'comfy-ui'
    static_configs:
      - targets: ['comfy-ui:8188']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'comfy-ui'

  # RAG Workbench
  - job_name: 'rag-workbench'
    static_configs:
      - targets: ['rag-workbench:3000']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'rag-workbench'

  # Multi-Agent Chatbot
  - job_name: 'multi-agent-chatbot'
    static_configs:
      - targets: ['multi-agent-chatbot:8080']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'chatbot'

  # txt2kg
  - job_name: 'txt2kg'
    static_configs:
      - targets: ['txt2kg:3001']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'txt2kg'

  # VSS
  - job_name: 'vss'
    static_configs:
      - targets: ['vss:8081']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'vss'

  # Docker container metrics (if cAdvisor is running)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    honor_labels: true

  # Node exporter (if running for host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # NVIDIA GPU metrics (if DCGM exporter is running)
  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['dcgm-exporter:9400']
