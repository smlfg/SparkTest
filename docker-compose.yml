version: '3.8'

# DGX Spark Playbooks - Docker Compose Configuration
# Orchestrates all 10 agents with GPU support and shared interfaces

services:
  # Agent 1: Infrastructure Management
  agent1_infra:
    build:
      context: .
      dockerfile: agents/agent1_infra/Dockerfile
    container_name: agent1_infra
    ports:
      - "8001:8001"
    volumes:
      - ./agents/agent1_infra/data:/app/data
      - ./agents/agent1_infra/logs:/app/logs
      - ./shared:/app/shared:ro
    environment:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - AGENT_NAME=agent1_infra
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: '4.0'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - spark_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from shared.health_check import check_service; import sys; sys.exit(0 if check_service(8001, '/health') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Agent 2: Dashboard and Visualization
