# ============================================================================
# Konfiguration: Iteratives Fine-Tuning & Evaluation
# ============================================================================

# --- Modell-Konfiguration ---
model:
  # Base Model (Unsloth-kompatibel)
  base_model: "unsloth/Qwen2.5-Coder-1.5B-Instruct"
  # Alternative: "unsloth/Llama-3.2-1B-Instruct", "unsloth/Phi-3.5-mini-instruct"

  # Speicherpfad für Checkpoints
  checkpoint_dir: "./checkpoints"

  # Lora-Konfiguration
  lora:
    r: 16
    lora_alpha: 16
    lora_dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    bias: "none"
    task_type: "CAUSAL_LM"

# --- Training-Konfiguration ---
training:
  # Backend: "unsloth" oder "transformers"
  backend: "unsloth"

  # Distributed Training (für DGX Multi-GPU)
  distributed: true
  world_size: 4  # Anzahl GPUs

  # Batch-Größen
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4

  # Optimierung
  learning_rate: 2.0e-4
  warmup_steps: 5
  num_train_epochs: 3
  max_steps: -1  # -1 = komplette Epochs

  # Speichern
  save_steps: 100
  save_total_limit: 3

  # Flash Attention & Optimierungen
  use_flash_attention: true
  gradient_checkpointing: true
  bf16: true  # für A100/H100
  fp16: false

  # Logging
  logging_steps: 10
  report_to: ["tensorboard", "wandb"]

# --- Evaluation-Konfiguration ---
evaluation:
  # Test-Set
  test_file: "data/humaneval_test_10.json"
  num_test_samples: 10

  # Code-Generierung
  max_new_tokens: 512
  temperature: 0.2
  top_p: 0.95
  do_sample: true

  # Parallelisierung (PySpark)
  use_spark: true
  spark_master: "local[*]"  # oder "spark://dgx-cluster:7077"
  executor_memory: "8g"
  executor_cores: 2

  # Timeout für Code-Ausführung (Sekunden)
  code_timeout: 5

  # Sichere Ausführung
  sandbox_mode: true

# --- Daten-Konfiguration ---
data:
  # Trainingsdaten-Verzeichnis
  train_batches_dir: "data/train_batches"

  # Evaluations-Logs
  eval_logs_dir: "data/eval_logs"

  # Prompt-Template
  prompt_template: |
    ### Instruction:
    Write a Python function to solve the following problem:

    {problem_description}

    ### Response:

  # Train-Data-Format
  train_format: "alpaca"  # oder "chat", "completion"

# --- Report & Visualisierung ---
reporting:
  # Reports-Verzeichnis
  reports_dir: "reports"

  # Detaillierungsgrad
  verbosity: "detailed"  # "minimal", "normal", "detailed"

  # Was soll verglichen werden?
  compare_iterations: true
  show_code_examples: true
  max_examples_per_type: 3

  # Fehlertypen-Klassifikation
  error_categories:
    - "syntax_error"
    - "runtime_error"
    - "logic_error"
    - "timeout"
    - "empty_response"
    - "off_topic"

  # Visualisierung
  visualization:
    formats: ["png", "html"]
    dpi: 300
    style: "seaborn-v0_8-darkgrid"

# --- DGX Spark Playbook Integration ---
dgx_spark:
  # Siehe: https://github.com/NVIDIA/spark-rapids
  enabled: false  # auf true setzen bei DGX-Nutzung

  # RAPIDS Acceleration
  use_rapids: false
  rapids_memory_fraction: 0.8

  # Monitoring
  enable_profiling: true
  profile_output_dir: "./profiles"

# --- Didaktische Einstellungen ---
teaching:
  # Ausführlichkeit der Erklärungen
  explain_errors: true
  explain_improvements: true
  explain_stagnation: true

  # Beispiel-Annotationen
  annotate_code_examples: true
  highlight_differences: true

  # Lerntipps generieren
  generate_tips: true

  # Vergleichs-Metriken
  delta_metrics:
    - "pass_rate"
    - "syntax_correctness"
    - "avg_solution_length"
    - "error_distribution"
    - "token_overlap"

# --- Logging & Monitoring ---
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_dir: "logs"
  log_to_file: true
  log_to_console: true

# --- Reproduzierbarkeit ---
seed: 42
deterministic: true
