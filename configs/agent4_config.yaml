# Agent 4: Inference Engine Configuration
# High-performance inference with vLLM, TRT-LLM, and Speculative Decoding

agent:
  name: "Agent 4: Inference Engine"
  version: "1.0.0"
  description: "High-performance LLM inference with multiple backend support"

# Inference backends configuration
backends:
  vllm:
    enabled: true
    model: "meta-llama/Llama-2-7b-hf"
    host: "0.0.0.0"
    port: 8000

    # PagedAttention configuration
    gpu_memory_utilization: 0.9
    block_size: 16
    swap_space: 4  # GB

    # Parallelism
    tensor_parallel_size: 1
    pipeline_parallel_size: 1

    # Performance tuning
    max_num_seqs: 256
    max_model_len: 2048
    enable_prefix_caching: true
    enable_chunked_prefill: false

    # Precision
    dtype: "auto"  # auto, half, float16, bfloat16, float32
    quantization: null  # null, awq, gptq, squeezellm

  trt_llm:
    enabled: true
    engine_dir: "trt_engines/llama-2-7b"
    tokenizer_dir: "meta-llama/Llama-2-7b-hf"
    host: "0.0.0.0"
    port: 8001

    # Build configuration
    build:
      model_type: "llama"
      max_batch_size: 8
      max_input_len: 1024
      max_output_len: 512
      max_beam_width: 1

      # Precision
      precision: "float16"  # float32, float16, bfloat16, int8, fp8
      quantization: "none"  # none, int8_weight_only, int4_weight_only, int4_awq, int8_sq, fp8

      # Parallelism
      tensor_parallel_size: 1
      pipeline_parallel_size: 1

      # Plugins
      use_gpt_attention_plugin: true
      use_gemm_plugin: true
      use_layernorm_plugin: true
      enable_context_fmha: true
      enable_paged_kv_cache: true
      remove_input_padding: true

    # Server configuration
    server:
      max_num_sequences: 256
      kv_cache_free_gpu_mem_fraction: 0.9
      streaming: true

  speculative:
    enabled: true
    target_model: "meta-llama/Llama-2-7b-hf"
    draft_model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    host: "0.0.0.0"
    port: 8002

    # Speculation parameters
    num_speculative_tokens: 4
    acceptance_threshold: 0.8
    max_speculation_depth: 5

    # Strategy
    strategy: "standard"  # standard, medusa, eagle, lookahead

    # Features
    use_parallel_verification: true
    enable_token_tree: false
    adaptive_speculation: true

    # Performance
    batch_size: 1
    temperature: 0.7
    top_k: 50
    top_p: 0.9

# Default inference parameters
inference:
  default_backend: "vllm"
  fallback_backend: "trt_llm"

  generation:
    max_tokens: 512
    temperature: 0.7
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.0
    stream: false

  # Request handling
  timeout_seconds: 300
  max_retries: 3
  retry_delay_seconds: 1

# Monitoring and logging
monitoring:
  enabled: true
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_requests: true
  log_responses: false

  metrics:
    - latency
    - throughput
    - memory_usage
    - token_generation_rate
    - time_to_first_token

  prometheus:
    enabled: false
    port: 9090

# Resource limits
resources:
  gpu:
    device_ids: [0]  # GPU device IDs to use
    memory_limit_gb: 24

  cpu:
    num_workers: 4
    memory_limit_gb: 32

# Health check configuration
health_check:
  enabled: true
  interval_seconds: 30
  timeout_seconds: 10
  failure_threshold: 3

# Deployment settings
deployment:
  environment: "production"  # development, staging, production
  auto_scaling:
    enabled: false
    min_replicas: 1
    max_replicas: 4
    target_cpu_utilization: 70
    target_gpu_utilization: 80
