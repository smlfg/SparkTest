# NeMo Fine-tuning Configuration
# Agent 6: Multi-GPU Training Pipeline

name: nemo_finetuning

trainer:
  devices: 4  # Number of GPUs per node
  num_nodes: 1  # Number of nodes (integrates with Agent 1)
  accelerator: gpu
  strategy: ddp  # Options: ddp, ddp_sharded, fsdp
  precision: bf16-mixed  # Options: bf16-mixed, 16-mixed, 32
  max_epochs: 10
  val_check_interval: 1.0
  limit_val_batches: 50
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1

exp_manager:
  exp_dir: /workspace/logs/nemo
  name: nemo_finetuning
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: val_loss
    save_top_k: 3
    mode: min
    always_save_nemo: true
    save_best_model: true
    every_n_epochs: 1
    filename: '{epoch}-{step}-{val_loss:.2f}'
  resume_if_exists: true
  resume_ignore_no_checkpoint: true
  create_wandb_logger: false

model:
  # Model parallelism settings
  micro_batch_size: 4
  global_batch_size: 16
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  virtual_pipeline_model_parallel_size: null

  # Memory optimization
  gradient_as_bucket_view: true

  # Optimizer configuration
  optim:
    name: fused_adam
    lr: 5.0e-5
    weight_decay: 0.01
    betas:
      - 0.9
      - 0.999
    sched:
      name: CosineAnnealing
      warmup_steps: 100
      constant_steps: 0
      min_lr: 5.0e-6

  # Data configuration
  data:
    data_prefix: /workspace/data/nemo
    num_workers: 4
    dataloader_type: single
    reset_position_ids: false
    reset_attention_mask: false
    eod_mask_loss: false

  # Sequence settings
  encoder_seq_length: 2048
  max_position_embeddings: 2048

  # Attention settings
  num_attention_heads: 16
  hidden_size: 1024
  num_layers: 24

  # Activation and normalization
  activation: gelu
  layernorm_epsilon: 1.0e-5
  apply_query_key_layer_scaling: true

  # Initialization
  init_method_std: 0.02

  # Mixed precision
  native_amp_init_scale: 4294967296
  native_amp_growth_interval: 1000
  fp16_lm_cross_entropy: false

  # Miscellaneous
  seed: 1234
  use_cpu_initialization: false

# Multi-node configuration (Agent 1 integration)
cluster:
  master_addr: localhost
  master_port: 12345
  world_size: 1
  rank: 0

# Checkpoint configuration
checkpoint:
  save_dir: /workspace/checkpoints/nemo
  save_interval: 1000
  keep_last_n: 3
  format: nemo

# Validation configuration (Agent 4 integration)
validation:
  enabled: true
  validation_interval: 500
  num_validation_samples: 10
  inference_endpoint: http://localhost:8004/api/v1/inference
