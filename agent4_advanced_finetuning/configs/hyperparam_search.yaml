# Hyperparameter Search Configuration
# Defines search space for hyperparameter optimization

# Base configuration (inherited by all trials)
base_config: "agent4_advanced_finetuning/configs/train_config.yaml"

# Search method
search:
  method: "grid"  # grid, random, bayesian
  num_trials: 10
  timeout_per_trial: 3600  # seconds
  metric: "eval_loss"
  direction: "minimize"  # minimize or maximize

# Search space
search_space:
  lora.r:
    type: "categorical"
    values: [4, 8, 16, 32]

  lora.lora_alpha:
    type: "categorical"
    values: [8, 16, 32]

  training.learning_rate:
    type: "loguniform"
    low: 1.0e-5
    high: 5.0e-4

  training.batch_size:
    type: "categorical"
    values: [2, 4, 8]

  training.weight_decay:
    type: "loguniform"
    low: 0.001
    high: 0.1

  lora.lora_dropout:
    type: "uniform"
    low: 0.0
    high: 0.2

# Early stopping for trials
early_stopping:
  enabled: true
  patience: 2
  min_delta: 0.01

# Resource allocation
resources:
  gpu_per_trial: 1
  max_concurrent_trials: 1

# Output
output:
  results_dir: "agent4_advanced_finetuning/hyperparam_results"
  best_config_path: "agent4_advanced_finetuning/configs/best_config.yaml"
  save_all_trials: true
