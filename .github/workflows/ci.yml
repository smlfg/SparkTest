name: SparkTest CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: flake8 services/ tests/ --max-line-length=120 --extend-ignore=E203,W503

    - name: Check code formatting with black
      run: black --check services/ tests/

    - name: Check import sorting with isort
      run: isort --check-only services/ tests/

    - name: Type checking with mypy
      run: mypy services/ --ignore-missing-imports
      continue-on-error: true

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Create required directories
      run: |
        mkdir -p spark/jobs spark/data spark/logs
        mkdir -p database/init
        mkdir -p reports
        mkdir -p monitoring/grafana/dashboards

    - name: Start services
      run: |
        docker-compose up -d
        sleep 30  # Wait for services to be ready

    - name: Check service health
      run: |
        docker-compose ps
        curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8000/health

    - name: Run smoke tests
      run: |
        docker-compose exec -T test-runner pytest -v -m smoke --tb=short

    - name: Run integration tests
      run: |
        docker-compose exec -T test-runner pytest -v -m integration \
          --junit-xml=/reports/junit.xml \
          --html=/reports/report.html \
          --self-contained-html

    - name: Run coverage report
      run: |
        docker-compose exec -T test-runner pytest \
          --cov=/app \
          --cov-report=xml:/reports/coverage.xml \
          --cov-report=html:/reports/htmlcov

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: reports/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./reports/coverage.xml
        flags: integration
        name: codecov-sparktest

    - name: Show logs on failure
      if: failure()
      run: docker-compose logs

    - name: Cleanup
      if: always()
      run: docker-compose down -v

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Start services
      run: |
        docker-compose up -d
        sleep 30

    - name: Run benchmarks
      run: |
        docker-compose exec -T test-runner pytest -v -m benchmark \
          --benchmark-only \
          --benchmark-json=/reports/benchmark.json

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: reports/benchmarks/

    - name: Cleanup
      if: always()
      run: docker-compose down -v

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push API Gateway
      uses: docker/build-push-action@v4
      with:
        context: ./services/api-gateway
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/sparktest-api:latest
          ${{ secrets.DOCKER_USERNAME }}/sparktest-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Test Runner
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.test
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/sparktest-test:latest
          ${{ secrets.DOCKER_USERNAME }}/sparktest-test:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # Example: kubectl apply -f k8s/staging/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, benchmark]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your deployment commands here
        # Example: kubectl apply -f k8s/production/

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint, test, benchmark, security]
    if: always()

    steps:
    - name: Send notification
      run: |
        echo "Pipeline completed"
        # Add notification logic (Slack, email, etc.)
