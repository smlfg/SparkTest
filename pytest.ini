[pytest]
# Pytest configuration for SparkTest

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers
markers =
    smoke: Quick smoke tests for critical paths
    integration: Integration tests requiring full stack
    performance: Performance and benchmark tests
    slow: Tests that take a long time to run
    agent1: Agent 1 (Data Ingestion) tests
    agent2: Agent 2 (Data Processing) tests
    agent3: Agent 3 (Analytics) tests
    agent4: Agent 4 (ML Pipeline) tests
    agent5: Agent 5 (Query Engine) tests
    agent6: Agent 6 (Batch Processing) tests
    agent7: Agent 7 (Stream Processing) tests
    agent8: Agent 8 (Scheduler) tests
    agent9: Agent 9 (Monitoring) tests
    agent10: Agent 10 (Integration + Testing) tests
    benchmark: Performance benchmark tests

# Timeout
timeout = 300
timeout_method = thread

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
